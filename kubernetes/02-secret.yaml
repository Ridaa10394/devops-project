# DEV-ONLY credentials for the local minikube demo. These values are fake and
# only ever live inside the throwaway cluster. For a real environment create
# the Secret out-of-band instead of committing it, e.g.
#   kubectl -n final-app create secret generic stocksense-db \
#     --from-literal=DB_USER=stocksense --from-literal=DB_PASSWORD="$(openssl rand -base64 24)"
# (or use Sealed Secrets / External Secrets Operator + AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: stocksense-db
  namespace: final-app
  labels: {app.kubernetes.io/part-of: stocksense}
type: Opaque
stringData:
  DB_USER: "stocksense"
  DB_PASSWORD: "local-minikube-only"
