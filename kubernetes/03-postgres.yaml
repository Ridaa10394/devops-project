# PostgreSQL as a StatefulSet: stable identity (stocksense-postgres-0) and its
# own PersistentVolumeClaim from volumeClaimTemplates, so data survives pod restarts.
apiVersion: v1
kind: Service
metadata:
  name: stocksense-postgres
  namespace: final-app
  labels: {app: stocksense-postgres, app.kubernetes.io/part-of: stocksense}
spec:
  clusterIP: None # headless - gives the StatefulSet pod a stable DNS name
  selector: {app: stocksense-postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stocksense-postgres
  namespace: final-app
  labels: {app: stocksense-postgres, app.kubernetes.io/part-of: stocksense}
spec:
  serviceName: stocksense-postgres
  replicas: 1
  selector:
    matchLabels: {app: stocksense-postgres}
  template:
    metadata:
      labels: {app: stocksense-postgres, app.kubernetes.io/part-of: stocksense}
    spec:
      securityContext:
        # run as the image's own postgres user (uid 70 in the alpine image) from the start
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: stocksense-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: stocksense-db, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: stocksense-db, key: DB_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # subdir, avoids lost+found on real disks
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - {name: run, mountPath: /var/run/postgresql} # unix socket + pid
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
