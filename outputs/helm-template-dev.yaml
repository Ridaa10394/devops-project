kind: Ingress
metadata:
  name: stocksense
  labels:
    helm.sh/chart: stocksense-1.0.0
    app.kubernetes.io/part-of: stocksense
    app.kubernetes.io/instance: stocksense
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: nginx
  rules:
    - host: "stocksense.localhost"
      http:
        paths:
          # /api -> FastAPI. The service name/port are derived from the same
          # helpers as the Service itself, so they can never drift apart.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stocksense-backend
                port: {number: 8000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stocksense-frontend
                port: {number: 80}

