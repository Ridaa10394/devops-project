# Source: stocksense/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocksense-backend
  labels:
    helm.sh/chart: stocksense-1.0.0
    app.kubernetes.io/part-of: stocksense
    app.kubernetes.io/instance: stocksense
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stocksense-backend
    app.kubernetes.io/instance: stocksense
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: stocksense-backend
      app.kubernetes.io/instance: stocksense
  template:
    metadata:
      labels:
        helm.sh/chart: stocksense-1.0.0
        app.kubernetes.io/part-of: stocksense
        app.kubernetes.io/instance: stocksense
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: stocksense-backend
        app.kubernetes.io/instance: stocksense
      annotations:
        # roll the pods when config or credentials change
        checksum/config: ab619ee0e4c26699f604dbc02c668e772e0270d797008193b23d3e603536b068
        checksum/secret: d3b6627e5f672316cca7d6563966851d9a9506763b6610fac30893abf1cdd589
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: stocksense-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python -m app.wait_for_db && alembic upgrade head"]
          envFrom:
            - configMapRef: {name: stocksense-config}
            - secretRef: {name: stocksense-db}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
      containers:
        - name: backend
          image: stocksense-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: RUN_MIGRATIONS, value: "false"}
          envFrom:
            - configMapRef: {name: stocksense-config}
            - secretRef: {name: stocksense-db}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}

