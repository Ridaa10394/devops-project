# Source: stocksense/templates/tests/test-smoke.yaml
# `helm test <release>` - checks the API, the readiness (DB) endpoint and the
# frontend -> backend proxy from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: stocksense-smoke-test
  labels:
    helm.sh/chart: stocksense-1.0.0
    app.kubernetes.io/part-of: stocksense
    app.kubernetes.io/instance: stocksense
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke
      image: stocksense-backend:1.0.0
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
      command:
        - python
        - -c
        - |
          import json, urllib.request
          be = "http://stocksense-backend:8000"
          fe = "http://stocksense-frontend"
          def get(url):
              with urllib.request.urlopen(url, timeout=5) as r:
                  print(r.status, url)
                  return r.read()
          assert json.loads(get(be + "/health"))["status"] == "UP"
          assert json.loads(get(be + "/ready"))["status"] == "READY"
          assert isinstance(json.loads(get(be + "/api/items")), list)
          assert b"http_requests_total" in get(be + "/metrics")
          assert b"<div id=\"root\">" in get(fe + "/")
          assert "total_items" in json.loads(get(fe + "/api/items/stats"))
          print("smoke test passed")
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 200m, memory: 128Mi}

