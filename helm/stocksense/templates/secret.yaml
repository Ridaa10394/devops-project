{{- if not .Values.auth.existingSecret }}
{{- $name := include "stocksense.secretName" . }}
{{- /* keep the same password across `helm upgrade` instead of rotating it every time */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.auth.password }}
{{- if not $password }}
{{- if and $existing $existing.data (index $existing.data "DB_PASSWORD") }}
{{- $password = index $existing.data "DB_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 20 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "stocksense.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.auth.username | quote }}
  DB_PASSWORD: {{ $password | quote }}
{{- end }}
