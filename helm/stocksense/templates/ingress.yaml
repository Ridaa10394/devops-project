{{- if .Values.ingress.enabled }}
{{- $fullname := include "stocksense.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "stocksense.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api -> FastAPI. The service name/port are derived from the same
          # helpers as the Service itself, so they can never drift apart.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port: {number: {{ .Values.backend.port }}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port: {number: 80}
{{- end }}
