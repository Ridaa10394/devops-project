apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stocksense.fullname" . }}-config
  labels:
    {{- include "stocksense.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appEnv | quote }}
  DB_HOST: {{ include "stocksense.dbHost" . | quote }}
  DB_PORT: {{ ternary 5432 .Values.externalDatabase.port .Values.postgres.enabled | quote }}
  DB_NAME: {{ .Values.postgres.database | quote }}
  BACKEND_URL: {{ printf "http://%s-backend:%v" (include "stocksense.fullname" .) .Values.backend.port | quote }}
