line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's Depends() in default args is the documented pattern
ignore = ["B008"]

[lint.isort]
# the local alembic/ folder holds migrations; the real "alembic" import is the library
known-third-party = ["alembic"]
known-first-party = ["app"]
